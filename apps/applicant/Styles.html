<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1f1e1c;
    --muted: #6b6963;
    --border: #e3e1db;
    --primary: #2a78d6;
    --primary-ink: #ffffff;
    --danger: #c9302c;
    --danger-bg: #fdecea;
    --ok: #1a7f4b;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --text: #f0efec;
      --muted: #a8a69f;
      --border: #34332f;
      --primary: #3987e5;
      --danger: #ef6b67;
      --danger-bg: #3a1d1c;
      --ok: #4cc38a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 16px; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  .app-header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .app-header__inner { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .app-title { font-size: 18px; margin: 0; }
  .badge { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--badge-color, var(--primary)); }
  .container { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  .step { color: var(--muted); font-size: 13px; margin: 8px 0 0; letter-spacing: .05em; }
  .view-title { font-size: 20px; margin: 4px 0 16px; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }

  .category-list { display: grid; gap: 12px; }
  .category-card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--cat-color, var(--primary)); border-radius: var(--radius); padding: 18px 20px; cursor: pointer; color: var(--text); font: inherit; box-shadow: var(--shadow); }
  .category-card:hover, .category-card:focus-visible { border-color: var(--cat-color, var(--primary)); outline: none; }
  .category-card__name { font-size: 20px; font-weight: 700; display: block; }
  .category-card__desc { color: var(--muted); font-size: 14px; }

  .field { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .field.has-error { border-color: var(--danger); }
  .field label.field__label, .field .field__label { display: block; font-weight: 700; margin-bottom: 4px; }
  .req { color: var(--danger); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .field__help { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .field__error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 44px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .yen { position: relative; }
  .yen input { padding-left: 32px; }
  .yen::before { content: "¥"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .choices { display: grid; gap: 8px; }
  .choice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--bg); }
  .choice input { margin-top: 4px; width: 18px; height: 18px; }
  .choice:has(input:checked) { border-color: var(--primary); }

  .combo { position: relative; }
  .combo__row { display: flex; gap: 0; }
  .combo__row input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .combo__toggle { flex: none; width: 48px; border: 1px solid var(--border); border-left: none; border-radius: 0 8px 8px 0; background: var(--bg); color: var(--muted); font-size: 12px; cursor: pointer; }
  .combo__list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; max-height: 280px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .combo__item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .combo__item:hover, .combo__item.is-active { background: var(--bg); }
  .combo__name { font-weight: 600; }
  .combo__meta { font-size: 12px; color: var(--muted); }
  .combo__empty { padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .combo__hint { margin: 8px 0 0; font-size: 13px; color: var(--ok); }
  .field.is-autofilled { animation: autofill 1.6s ease-out; }
  @keyframes autofill { 0% { border-color: var(--ok); box-shadow: 0 0 0 3px rgba(26,127,75,.18); } 100% { box-shadow: none; } }
  .dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px; text-align: center; cursor: pointer; background: var(--bg); }
  .dropzone.is-over { border-color: var(--primary); }
  .dropzone__main { font-weight: 700; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
  .thumb { position: relative; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center; padding: 4px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .thumb__remove { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; font-size: 16px; line-height: 1; z-index: 1; }

  .calc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; }
  .calc strong { font-size: 16px; }
  .alert { background: var(--danger-bg); color: var(--danger); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; white-space: pre-line; }
  .actions { display: flex; gap: 12px; margin-top: 16px; }
  .actions .btn--primary { flex: 1; }
  .actions--stack { flex-direction: column; }
  .btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 12px 18px; min-height: 48px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn--ghost { background: transparent; }
  .btn:disabled { opacity: .6; cursor: default; }
  .done-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 34px; line-height: 64px; margin: 8px auto 12px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .overlay__box { background: var(--surface); border-radius: var(--radius); padding: 24px 32px; text-align: center; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 24px auto 8px; animation: spin 0.8s linear infinite; }
  .overlay .spinner { margin-top: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
