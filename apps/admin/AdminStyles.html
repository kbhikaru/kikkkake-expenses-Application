<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #fafaf8;
    --text: #1f1e1c;
    --muted: #6b6963;
    --border: #e3e1db;
    --grid: #ecebe6;
    --primary: #2a78d6;
    --primary-ink: #ffffff;
    --series-1: #2a78d6;
    --danger: #c9302c;
    --danger-bg: #fdecea;
    --ok: #1a7f4b;
    --ok-bg: #e7f5ee;
    --warn: #9a6400;
    --warn-bg: #fdf3dc;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --surface-2: #262624;
      --text: #f0efec;
      --muted: #a8a69f;
      --border: #34332f;
      --grid: #2c2b28;
      --primary: #3987e5;
      --series-1: #3987e5;
      --danger: #ef6b67;
      --danger-bg: #3a1d1c;
      --ok: #4cc38a;
      --ok-bg: #16301f;
      --warn: #e0a83a;
      --warn-bg: #33270f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 14px; line-height: 1.6; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  a { color: var(--primary); }
  code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; font-size: 12px; word-break: break-all; }

  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login__card { width: 100%; max-width: 360px; display: grid; gap: 12px; }
  .login__card h1 { font-size: 20px; margin: 0; }

  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; padding: 0 16px; flex-wrap: wrap; }
  .topbar__brand { font-weight: 700; padding: 12px 0; }
  .topbar__right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 14px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab.is-active { color: var(--text); border-bottom-color: var(--primary); font-weight: 700; }
  .main { max-width: 1280px; margin: 0 auto; padding: 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; min-width: 0; }
  .card--flush { padding: 0; }
  .card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card__title { font-size: 15px; margin: 0 0 8px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
  .grid2 > .card { margin-bottom: 0; }
  .grid2 + .card, .grid2 + .grid2 { margin-top: 16px; }
  .grid2--flat { gap: 16px; align-items: start; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin-bottom: 16px; }
  .filters label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  .filters .grow { flex: 1; min-width: 200px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.is-active { border-color: var(--primary); color: var(--primary); font-weight: 700; }
  .subtabs { display: flex; gap: 8px; margin-bottom: 12px; }

  input[type=text], input[type=password], input[type=number], input[type=date], input[type=month], input[type=search], select, textarea {
    font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-height: 34px; width: 100%;
  }
  .filters input, .filters select { width: auto; }
  .filters .grow input { width: 100%; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; }
  .form-grid { display: grid; gap: 10px; margin: 8px 0 12px; }
  .form-grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .check { display: flex !important; align-items: center; gap: 8px; color: var(--text) !important; font-size: 13px !important; }
  .check input { width: auto; }

  .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn--sm { padding: 5px 10px; font-size: 13px; }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn--ghost { background: transparent; border-color: transparent; }
  .btn--danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .card__head .btn-row { margin-top: 0; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi__label { color: var(--muted); font-size: 12px; }
  .kpi__value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .kpi__sub { color: var(--muted); font-size: 12px; }
  .kpi--warn .kpi__value { color: var(--warn); }

  .chart-box { position: relative; height: 280px; }
  .chart-box--tall { height: 420px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

  .table-wrap { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th, .table td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
  .table th { color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table--hover tbody tr { cursor: pointer; }
  .table--hover tbody tr:hover { background: var(--surface-2); }
  .table--edit td { padding: 4px; }
  .table--edit input, .table--edit select { min-height: 30px; padding: 4px 6px; }
  .nowrap { white-space: nowrap; }
  .ellipsis { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; white-space: nowrap; border: 1px solid var(--border); }
  .status--申請中 { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .status--承認済 { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .status--差戻し { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .status--freee連携済 { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c, var(--muted)); }

  .bulkbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .bulkbar__actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .field-row { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--surface-2); }
  .field-row.is-disabled { opacity: .6; }
  .field-row__head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field-row__head .grow { flex: 1; min-width: 200px; }
  .field-row__head select { width: auto; }
  .field-row__body { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
  .field-row__body label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; color: var(--muted); white-space: nowrap; }

  .settings { display: grid; gap: 12px; }
  .settings label { display: grid; gap: 2px; }
  .settings .key { font-weight: 600; font-size: 13px; }
  .settings .note { color: var(--muted); font-size: 12px; }
  .links { margin: 0; padding-left: 18px; }

  .result { margin: 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); white-space: pre-line; font-size: 13px; }
  .result--ok { background: var(--ok-bg); border-color: transparent; }
  .result--ng { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .alert { background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 8px 12px; white-space: pre-line; }
  .details { margin: 8px 0; }
  .details summary { cursor: pointer; font-weight: 600; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; }
  .modal__box { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 760px; padding: 16px 20px 20px; }
  .modal__head { display: flex; justify-content: space-between; align-items: center; }
  .modal__head h2 { font-size: 17px; margin: 0; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 12px 0; }
  .detail-grid label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  .detail-grid .wide { grid-column: 1 / -1; }
  .receipts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .meta { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2px 12px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; z-index: 100; max-width: calc(100% - 32px); white-space: pre-line; }
  .toast--ng { background: var(--danger); color: #fff; }
  .busy { position: fixed; inset: 0; background: rgba(0,0,0,.15); z-index: 90; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 640px) {
    .topbar__right { margin-left: 0; width: 100%; justify-content: space-between; padding-bottom: 8px; }
  }
</style>
